<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>GrowthEko Ops</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, Arial, sans-serif;
      color: #0d1220;
      background:
        radial-gradient(circle at 18% 10%, rgba(86, 144, 255, 0.20), transparent 26%),
        radial-gradient(circle at 86% 4%, rgba(198, 218, 255, 0.55), transparent 24%),
        linear-gradient(135deg, #f8fbff 0%, #eef5ff 44%, #f7f9ff 100%);
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .loader {
      width: min(100%, 360px);
      padding: 28px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 24px 70px rgba(31, 45, 76, 0.14);
      text-align: center;
    }
    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 16px;
      border-radius: 999px;
      border: 3px solid rgba(13, 18, 32, 0.14);
      border-top-color: #0d1220;
      animation: spin 900ms linear infinite;
    }
    strong { display: block; font-size: 15px; }
    span { display: block; margin-top: 6px; color: #697386; font-size: 13px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="loader">
    <div class="spinner" aria-hidden="true"></div>
    <strong>Opening Ops</strong>
    <span>Checking internal access...</span>
  </main>
  <script>
    (async () => {
      try {
        const response = await fetch('/api/ops-page', {
          credentials: 'include',
          headers: { 'Accept': 'text/html' }
        });
        if (response.redirected || response.url.includes('/ops-login') || !response.ok) {
          window.location.replace('/ops-login?next=/ops');
          return;
        }
        const html = await response.text();
        document.open();
        document.write(html);
        document.close();
      } catch {
        window.location.replace('/ops-login?next=/ops');
      }
    })();
  </script>
</body>
</html>
