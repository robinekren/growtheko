<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b08a4a"/>
      <stop offset="100%" stop-color="#d4af6c"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <path d="M0 105 L1200 105 M0 210 L1200 210 M0 315 L1200 315 M0 420 L1200 420 M0 525 L1200 525" stroke="#0a0a0a" stroke-width="1"/>
    <path d="M150 0 L150 630 M300 0 L300 630 M450 0 L450 630 M600 0 L600 630 M750 0 L750 630 M900 0 L900 630 M1050 0 L1050 630" stroke="#0a0a0a" stroke-width="1"/>
  </g>

  <!-- Top brand bar -->
  <g transform="translate(80, 80)">
    <text font-family="Inter, -apple-system, system-ui, sans-serif" font-size="22" font-weight="700" fill="#0a0a0a" letter-spacing="-0.5">GrowthEko</text>
    <text x="148" y="0" font-family="Inter, sans-serif" font-size="18" font-weight="400" fill="#6a6a6a">by Robin Ekren</text>
  </g>

  <!-- Pill: Phase indicator -->
  <g transform="translate(80, 130)">
    <rect width="240" height="34" rx="17" fill="#ffffff" stroke="#e9e9e9" stroke-width="1.5"/>
    <text x="120" y="22" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#6a6a6a" text-anchor="middle" letter-spacing="0.5">HIGH-TICKET · PHASE 1 OPEN · 2026</text>
  </g>

  <!-- Main headline -->
  <g transform="translate(80, 230)">
    <text font-family="Instrument Serif, Georgia, serif" font-size="100" font-weight="400" fill="#0a0a0a" letter-spacing="-3">Build your</text>
    <text y="105" font-family="Instrument Serif, Georgia, serif" font-size="100" font-weight="400" fill="url(#goldGrad)" font-style="italic" letter-spacing="-3">AI Empire.</text>
  </g>

  <!-- Subline -->
  <g transform="translate(80, 470)">
    <text font-family="Inter, sans-serif" font-size="22" font-weight="400" fill="#2a2a2a" letter-spacing="-0.3">Membership. Audit. Implementation.</text>
    <text y="32" font-family="Inter, sans-serif" font-size="22" font-weight="400" fill="#6a6a6a" letter-spacing="-0.3">Turn AI into a working operator system.</text>
  </g>

  <!-- Bottom right: Tier preview -->
  <g transform="translate(820, 230)" filter="url(#softShadow)">
    <rect width="300" height="320" rx="16" fill="#0a0a0a"/>
    <text x="24" y="40" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.5)" letter-spacing="1.5">THE LADDER</text>

    <g transform="translate(24, 70)">
      <text font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="rgba(255,255,255,0.7)">Membership</text>
      <text x="250" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" fill="#ffffff" text-anchor="end">$97 USD/month — net, plus applicable taxes</text>
    </g>
    <line x1="24" y1="85" x2="276" y2="85" stroke="rgba(255,255,255,0.1)"/>

    <g transform="translate(24, 110)">
      <text font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="rgba(255,255,255,0.7)">AI Operator Audit</text>
      <text x="250" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" fill="#ffffff" text-anchor="end">$1,997 USD one-time — net, plus applicable taxes</text>
    </g>
    <line x1="24" y1="125" x2="276" y2="125" stroke="rgba(255,255,255,0.1)"/>

    <g transform="translate(24, 150)">
      <text font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="rgba(255,255,255,0.7)">Launch scope</text>
      <text x="250" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="end">International B2B</text>
    </g>
    <line x1="24" y1="165" x2="276" y2="165" stroke="rgba(255,255,255,0.15)"/>

    <g transform="translate(24, 195)">
      <text font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="url(#goldGrad)" letter-spacing="1.1">NON-AT ORDERS · MANUAL TAX REVIEW</text>
    </g>
    <g transform="translate(24, 220)">
      <text font-family="Instrument Serif, Georgia, serif" font-size="26" font-weight="400" fill="#ffffff">Built for operators</text>
    </g>

    <g transform="translate(24, 270)">
      <rect width="252" height="40" rx="20" fill="#ffffff"/>
      <text x="126" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#0a0a0a" text-anchor="middle">See offers at growtheko.com →</text>
    </g>
  </g>

  <!-- Bottom URL strip -->
  <g transform="translate(80, 580)">
    <text font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#6a6a6a" letter-spacing="1.5">GROWTHEKO.COM · INTERNATIONAL B2B · OPERATED IN AUSTRIA</text>
  </g>

  <!-- Gold accent line bottom -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#goldGrad)"/>
</svg>
