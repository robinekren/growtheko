<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>GrowthEko CRM</title>
  <style>
    :root{--ink:#0b1020;--muted:#687386;--line:rgba(15,23,42,.09);--blue:#2167ea;--bg:#f3f7ff;--card:rgba(255,255,255,.82)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,rgba(85,144,255,.16),transparent 25%),linear-gradient(145deg,#fafcff,var(--bg));padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}
    button,input{font:inherit}.shell{width:min(1160px,100%);margin:auto;padding:24px 0 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{letter-spacing:.25em;font-weight:800;font-family:Georgia,serif}.live{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.live i{width:8px;height:8px;border-radius:50%;background:#23b26d}
    .nav{display:flex;align-items:center;justify-content:center;gap:4px;margin:0 auto 30px;width:max-content;max-width:100%;padding:5px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.7);overflow:auto}.nav button{border:0;background:transparent;padding:9px 14px;border-radius:999px;color:var(--muted);font-weight:750;white-space:nowrap;cursor:pointer}.nav button.active{background:#fff;color:var(--ink);box-shadow:0 3px 14px rgba(30,50,90,.1)}
    .headline{margin:0 0 7px;font:700 clamp(30px,5vw,52px)/1.02 Georgia,serif;letter-spacing:-.04em}.sub{margin:0 0 24px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.stat,.panel{border:1px solid var(--line);background:var(--card);box-shadow:0 16px 50px rgba(35,61,105,.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}.stat{padding:18px;border-radius:18px}.stat b{display:block;font-size:26px}.stat span{font-size:12px;color:var(--muted)}
    .panel{border-radius:24px;overflow:hidden}.row{display:grid;grid-template-columns:minmax(170px,1.25fr) minmax(140px,1fr) minmax(120px,.8fr) 92px;gap:14px;align-items:center;width:100%;padding:17px 20px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;color:inherit;cursor:pointer}.row:last-child{border-bottom:0}.row:hover{background:rgba(33,103,234,.035)}.person b{display:block}.person span,.small{color:var(--muted);font-size:12px}.pill{width:max-content;max-width:100%;padding:7px 10px;border-radius:999px;background:#edf3ff;color:#1556c7;font-size:11px;font-weight:800}.price{text-align:right;font-weight:800}.empty,.loading{padding:42px 24px;text-align:center;color:var(--muted)}
    .drawer{display:none;margin-top:14px;padding:22px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.82)}.drawer.open{display:block}.drawer h2{margin:0 0 5px;font:700 28px Georgia,serif}.drawer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.detail{padding:15px;border:1px solid var(--line);border-radius:16px;background:rgba(246,249,255,.8);overflow-wrap:anywhere}.detail label{display:block;margin-bottom:5px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.detail p{margin:0;line-height:1.5}.timeline{margin-top:18px}.event{padding:15px 0;border-top:1px solid var(--line)}.event p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.event-head{display:flex;justify-content:space-between;gap:10px;font-size:12px}.event-head span{color:var(--muted)}
    .error{padding:18px;border-radius:16px;background:#fff4f4;color:#9d2c2c}
    @media(max-width:720px){body{padding-left:12px;padding-right:12px}.shell{padding-top:18px}.top{margin-bottom:20px}.stats{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:minmax(0,1fr) auto;padding:16px}.row .offer,.row .price{display:none}.drawer-grid{grid-template-columns:1fr}.nav{justify-content:flex-start;width:100%}.headline{font-size:36px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand">GROWTHEKO</div><div class="live"><i></i><span>Live CRM</span></div></header>
    <nav class="nav" aria-label="CRM views"><button class="active" data-view="pipeline">Pipeline</button><button data-view="customers">Customers</button><button data-view="inbox">Inbox</button><button data-view="decisions">Decisions</button></nav>
    <h1 class="headline" id="title">Pipeline</h1><p class="sub" id="subtitle">Real people. Real activity. No demo records.</p>
    <section class="stats" id="stats"></section><section class="panel" id="list"><div class="loading">Loading verified CRM records…</div></section><section class="drawer" id="drawer"></section>
  </main>
  <script>
    const state={data:null,view:'pipeline'};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const date=v=>v?new Intl.DateTimeFormat('en-GB',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v)):'—';const money=(n,c='USD')=>new Intl.NumberFormat('en-US',{style:'currency',currency:c,maximumFractionDigits:0}).format(Number(n)||0);
    const titles={pipeline:['Pipeline','Real people. Real activity. No demo records.'],customers:['Customers','Paid and active customer records from the source system.'],inbox:['Inbox','Every stored customer and team interaction in one timeline.'],decisions:['Decisions','Only genuine unresolved gates belong here.']};
    function renderStats(){const d=state.data,unread=d.interactions.filter(x=>x.sender_type==='customer'&&!x.read_at&&x.message_type==='text').length,paid=d.people.reduce((s,p)=>s+(p.amount_paid||0),0);stats.innerHTML=[[d.leads.length,'Open applicants'],[d.people.length,'Customers'],[unread,'Customer messages'],[money(paid),'Recorded cash']].map(x=>`<div class="stat"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}
    function entityRows(items){if(!items.length)return '<div class="empty">No real records in this view.</div>';return items.map(item=>`<button class="row" data-id="${esc(item.id)}" data-type="entity"><div class="person"><b>${esc(item.name)}</b><span>${esc(item.email||item.company||'No email')}</span></div><div class="offer"><b>${esc(item.offer?.name)}</b><div class="small">${esc(item.offer?.price)}</div></div><span class="pill">${esc(item.stage||item.status||'Review')}</span><span class="price">${item.amount_paid?esc(money(item.amount_paid,item.currency)):''}</span></button>`).join('')}
    function interactionRows(items){if(!items.length)return '<div class="empty">No stored interactions.</div>';return items.map(item=>`<button class="row" data-id="${esc(item.id)}" data-type="interaction"><div class="person"><b>${esc(item.sender_name||item.sender_type)}</b><span>${esc(item.email||item.message_type)}</span></div><div class="offer small">${esc(item.content.slice(0,110))}</div><span class="pill">${esc(item.sender_type)}</span><span class="price small">${esc(date(item.created_at))}</span></button>`).join('')}
    function render(){const d=state.data,[t,s]=titles[state.view];title.textContent=t;subtitle.textContent=s;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));let html='';if(state.view==='pipeline')html=entityRows([...d.leads,...d.people].sort((a,b)=>new Date(b.submitted_at||b.created_at)-new Date(a.submitted_at||a.created_at)));if(state.view==='customers')html=entityRows(d.people);if(state.view==='inbox')html=interactionRows(d.interactions.filter(x=>x.message_type==='text'));if(state.view==='decisions')html=entityRows([...d.people,...d.leads].filter(x=>x.offer?.review_required||x.status==='suspended'));list.innerHTML=html;drawer.classList.remove('open');list.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>openRecord(el.dataset.id,el.dataset.type))}
    function openRecord(id,type){const d=state.data;if(type==='interaction'){const x=d.interactions.find(i=>i.id===id);if(!x)return;drawer.innerHTML=`<h2>${esc(x.sender_name||'Interaction')}</h2><div class="small">${esc(date(x.created_at))}</div><div class="detail" style="margin-top:18px"><label>${esc(x.message_type)}</label><p>${esc(x.content)}</p></div>`}else{const x=[...d.people,...d.leads].find(i=>i.id===id);if(!x)return;const appId=x.application_id||x.id,timeline=d.interactions.filter(i=>i.application_id===appId);drawer.innerHTML=`<h2>${esc(x.name)}</h2><div class="small">${esc(x.email)}</div><div class="drawer-grid"><div class="detail"><label>Offer</label><p>${esc(x.offer?.name)} · ${esc(x.offer?.price)}</p></div><div class="detail"><label>Stage</label><p>${esc(x.stage||x.status)}</p></div><div class="detail"><label>Objective</label><p>${esc(x.primary_goal||'Not captured')}</p></div><div class="detail"><label>Bottleneck</label><p>${esc(x.biggest_bottleneck||'Not captured')}</p></div></div><div class="timeline"><h3>Interaction history</h3>${timeline.length?timeline.map(i=>`<div class="event"><div class="event-head"><b>${esc(i.sender_name||i.sender_type)}</b><span>${esc(date(i.created_at))}</span></div><p>${esc(i.content)}</p></div>`).join(''):'<div class="empty">No stored interaction yet.</div>'}</div>`}drawer.classList.add('open');drawer.scrollIntoView({behavior:'smooth',block:'start'})}
    document.querySelectorAll('.nav button').forEach(button=>button.onclick=()=>{state.view=button.dataset.view;render()});fetch('/api/crm-data',{credentials:'same-origin'}).then(async r=>{if(r.status===401){location.href='/ops-login?next=/crm';return}const d=await r.json();if(!r.ok)throw new Error(d.error||'CRM unavailable');state.data=d;renderStats();render()}).catch(error=>{list.innerHTML=`<div class="error">${esc(error.message)} No customer data was fabricated.</div>`});
  </script>
</body>
</html>
