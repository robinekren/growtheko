<body>
  <div class="ops-app">
    <aside class="sidebar">
      <div class="side-brand"><i>G</i><div><strong>GROWTHEKO</strong><small>NORA OPS</small></div></div>
      <nav class="side-nav" data-side-nav aria-label="Nora Ops modules">
        <button class="active" data-view="queue"><i>01</i><span>Queue</span><em id="queueBadge">0</em></button>
        <button data-view="customers"><i>02</i><span>Customers</span></button>
        <button data-view="pipeline"><i>03</i><span>Pipeline</span></button>
        <button data-view="inbox"><i>04</i><span>Inbox</span><em id="inboxBadge">0</em></button>
        <button data-view="decisions"><i>05</i><span>Decisions</span><em id="decisionBadge">0</em></button>
      </nav>
      <div class="side-foot"><i></i><div><strong>Policy-controlled</strong><small id="sourceMode">REAL DATA ONLY</small></div></div>
    </aside>
    <main class="workspace">
      <header class="topbar">
        <div class="sync"><i></i><span id="syncStatus">Loading source…</span></div>
        <label class="search" aria-label="Search current view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="searchInput" type="search" placeholder="Search this view" autocomplete="off"></label>
      </header>
      <div class="canvas">
        <section class="page-head"><div><span class="eyebrow" id="eyebrow">Nora control surface</span><h1 class="headline" id="title">Command Queue</h1><p class="sub" id="subtitle">One verified next action per record. Nora works from top to bottom; exceptions stop for approval.</p></div><div class="focus" id="focusSummary"><b>Nothing waiting</b><span>Source-backed queue</span></div></section>
        <section class="metrics" id="metrics"></section>
        <section class="lifecycle" id="offerLifecycle" hidden></section>
        <section class="autonomy" id="autonomyPanel" hidden></section>
        <div class="toolbar"><div class="filters" id="filters"></div><span class="result-count" id="resultCount"></span></div>
        <div class="content-grid" id="contentGrid"><section class="panel list" id="list"><div class="loading">Loading verified operations data…</div></section><aside class="detail-panel" id="detail" hidden></aside></div>
        <details class="decision-history" id="decisionHistory" hidden></details>
      </div>
    </main>
  </div>
  <script>
    const state={data:null,view:'queue',filter:'all',query:'',selected:null,phasePreview:null,historyQuery:'',historyWindow:'all',deliveryFeedback:null,scripts:{}};
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const date=value=>value?new Intl.DateTimeFormat('en-GB',{dateStyle:'medium',timeStyle:'short'}).format(new Date(value)):'Not stored';
    const money=(value,currency='USD')=>new Intl.NumberFormat('en-US',{style:'currency',currency,maximumFractionDigits:0}).format(Number(value)||0);
    const defs={
      queue:{eyebrow:'Nora control surface',title:'Command Queue',subtitle:'One verified next action per record. Nora works from top to bottom; exceptions stop for approval.'},
      customers:{eyebrow:'Single source of truth',title:'Customer 360',subtitle:'One record per lead or customer. Open it for the next action, onboarding, offer and complete customer timeline.'},
      pipeline:{eyebrow:'Opportunity truth',title:'Pipeline',subtitle:'Every opportunity, offer, revenue stage and next action in one operating view.'},
      inbox:{eyebrow:'Canonical email',title:'Inbox',subtitle:'Every customer email and Nora reply in one chronological ledger. Customer context opens beside it.'},
      decisions:{eyebrow:'Robin approval only',title:'Decisions',subtitle:'Only unresolved exceptions that Nora is not allowed to execute autonomously.'}
    };
    const filterDefs={
      queue:[['all','All'],['nora','Automatic'],['approval','Approval'],['p0','P0']],
      customers:[['all','All'],['customer','Customers'],['lead','Leads']],
      pipeline:[['all','All stages'],['diagnose','Diagnose'],['commit','Commit'],['deliver','Deliver'],['prove','Prove'],['attention','Attention']],
      inbox:[['all','All email'],['unread','Needs reply']],
      decisions:[['all','All active'],['p0','P0']]
    };
    const SCRIPT_PATHS={
      freestyle:{label:'Freestyle',stages:[['understand','Understand'],['help','Help'],['next_step','Next step']]},
      start_to_sale:{label:'Start to sale',stages:[['connect','Connect'],['context','Context'],['diagnose','Diagnose'],['clarify','Clarify'],['recommend','Recommend'],['commit','Commit'],['follow_up','Follow up']]},
      follow_up:{label:'Follow up',stages:[['reopen','Reopen'],['value','Value'],['question','Question'],['close_loop','Close loop']]},
      expansion:{label:'Expansion',stages:[['win','Win'],['gap','Gap'],['fit','Fit'],['permission','Permission'],['next_step','Next step']]}
    };
    function dueLabel(value){if(!value)return{label:'No deadline',overdue:false};const ms=new Date(value)-Date.now(),hours=Math.max(1,Math.round(Math.abs(ms)/36e5));if(ms<0)return{label:`Overdue ${hours<48?hours+'h':Math.round(hours/24)+'d'}`,overdue:true};if(hours<24)return{label:`Due in ${hours}h`,overdue:false};return{label:`Due ${date(value).split(',')[0]}`,overdue:false}}
    function metric(label,value){return `<div class="metric"><span>${esc(label)}</span><b>${esc(value)}</b></div>`}
    function allEntities(){return [...state.data.people.map(item=>({...item,entity_type:'customer'})),...state.data.leads.map(item=>({...item,entity_type:'lead'}))]}
    function setBadges(){const d=state.data,unread=inboxItems().filter(item=>item.item_type==='thread'&&item.unread_count>0).length;$('queueBadge').textContent=d.command_queue.length;$('inboxBadge').textContent=unread;$('decisionBadge').textContent=d.decisions.length}
    function renderMetrics(){const d=state.data,queue=d.command_queue,opportunities=d.opportunities||[],inbox=inboxItems(),threads=inbox.filter(item=>item.item_type==='thread'),unread=threads.filter(item=>item.unread_count>0).length,emailMessages=d.interactions.filter(item=>item.message_type==='text');let values=[];if(state.view==='queue')values=[['Ready',queue.filter(item=>item.execution_mode==='nora').length],['Approvals',d.decisions.length],['P0',queue.filter(item=>item.priority==='P0').length],['Overdue',queue.filter(item=>new Date(item.deadline)<new Date()).length]];if(state.view==='customers')values=[['All records',d.people.length+d.leads.length],['Customers',d.people.length],['Open leads',d.leads.length],['Audit events',d.audit_coverage?.event_count||0]];if(state.view==='pipeline')values=[['Opportunities',opportunities.length],['Active',opportunities.filter(item=>['open','active'].includes(item.opportunity_status)).length],['Delivering',opportunities.filter(item=>item.stage==='Deliver').length],['Needs review',opportunities.filter(item=>item.review_required).length]];if(state.view==='inbox')values=[['Email threads',threads.length],['Needs reply',unread],['Inbound',emailMessages.filter(item=>item.sender_type==='customer').length],['Sent',emailMessages.filter(item=>item.sender_type==='team').length]];if(state.view==='decisions')values=[['Active approvals',d.decisions.length],['P0',d.decisions.filter(item=>item.priority==='P0').length],['Automatic tasks',queue.filter(item=>item.execution_mode==='nora').length],['Resolved',d.decision_history.length]];$('metrics').innerHTML=values.map(([label,value])=>metric(label,value)).join('')}
    function renderLifecycle(){const visible=state.view==='pipeline',steps=state.data.offer_lifecycle||[],journey=state.data.customer_journey||[];$('offerLifecycle').hidden=!visible;if(!visible)return;$('offerLifecycle').innerHTML=`<div class="section-head"><h2>Offer ladder</h2><span>Pipeline scope · smallest useful offer first</span></div><div class="lifecycle-track">${steps.map((step,index)=>`<article class="lifecycle-step"><small>STEP ${String(index+1).padStart(2,'0')}</small><strong>${esc(step.name)}</strong><span>${esc(step.price)}${step.cadence==='monthly'?'/mo':''}</span><b>${esc(step.records)} record${step.records===1?'':'s'}</b></article>`).join('')}</div><div class="journey"><strong>Customer lifecycle</strong><div class="journey-track">${journey.map(step=>`<span class="journey-step"><span>${esc(step.name)}</span>${step.amounts?.length?`<span class="journey-amounts">${step.amounts.map(amount=>`<b class="journey-amount">${esc(amount)}</b>`).join('')}</span>`:''}</span>`).join('')}</div></div>`}

      return `<section class="conversation-script ${session.open?'open':''}" data-script-drawer><button class="script-toggle" type="button" data-script-toggle aria-expanded="${session.open}" aria-label="${session.open?'Close':'Open'} Nora reply guide"><span class="script-grip" aria-hidden="true"><i></i><i></i><i></i></span></button>${session.open?`<div class="script-body"><div class="script-tools"><select class="script-path" data-script-path aria-label="Reply path">${Object.entries(SCRIPT_PATHS).map(([key,value])=>`<option value="${key}" ${key===session.path?'selected':''}>${esc(value.label)}</option>`).join('')}</select><div class="script-formats" role="group" aria-label="Reply format"><button class="script-format ${session.format==='text'?'active':''}" type="button" data-script-format="text">Text</button><button class="script-format ${session.format==='voice_note'?'active':''}" type="button" data-script-format="voice_note">Voice note</button></div></div><div class="script-layout"><nav class="script-stages" aria-label="Reply phases">${path.stages.map(([key,label],index)=>{const done=session.completed[`${session.path}:${key}`];return `<button class="script-stage ${key===session.stage?'active':''} ${done?'done':''}" type="button" data-script-stage="${key}" aria-current="${key===session.stage?'step':'false'}"><span class="script-stage-dot"><span>${index+1}</span></span><span class="script-stage-label">${esc(label)}</span></button>`}).join('')}</nav><article class="script-card"><header class="script-card-head"><strong>${esc(active[1])}</strong><span>${session.format==='voice_note'?'Voice note':'Email draft'}</span></header><p class="script-copy ${!draft?'muted':''}" data-script-copy>${esc(session.loading?'Building the next clean reply…':session.error||draft||'Build a customer-specific draft for this phase.')}</p><div class="script-actions"><button class="script-action" type="button" data-script-use ${draft&&!session.loading?'':'disabled'}>Use draft</button><button clas     }
    function conversationDetail(thread){
      const entity=conversationEntity(thread),name=entity?.name||thread.name||'Customer',isPreview=Boolean(state.data.local_dev_scenario_data),realEmail=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(thread.email||'')&&!String(thread.email).endsWith('.local'),feedback=state.deliveryFeedback?.threadId===thread.id?state.deliveryFeedback:null,canSend=Boolean(thread.application_id&&(realEmail||isPreview)),session=scriptSession(thread),channel=isPreview?'Email preview':realEmail?'Email only':'No verified email';
      return `<div class="conversation-stack"><details class="conversation-context"><summary>${customerAvatar()}<span class="context-person"><strong>${esc(name)}</strong><small>${esc(thread.email||'No verified email')}</small></span><span class="context-state">${thread.unread_count?`${esc(thread.unread_count)} needs reply`:'Up to date'}</span><button class="context-close" type="button" data-close aria-label="Close conversation">×</button></summary><div class="context-body"><div class="context-fact"><small>Source</small><strong>Email ledger</strong></div><div class="context-fact"><small>Channel</small><strong>${esc(channel)}</strong></div><div class="context-fact"><small>Thread</small><strong>${esc(thread.messages.length)} stored email${thread.messages.length===1?'':'s'}</strong></div><div class="context-fact"><small>Status</small><strong>${thread.unread_count?'Reply required':'Current'}</strong></div>${entity?`<button class="context-link" type="button" data-open-entity="${esc(entity.id)}">Open Customer 360</button>`:''}</div></details><section class="conversation-shell"><header class="conversation-head"><div><small>Email thread</small><strong>${esc(name)}</strong></div>${emailDeliveryIcon(realEmail,isPreview,feedback)}</header><div class="conversation-messages" data-conversation-messages>${thread.messages.map(message=>{const team=message.sender_type==='team',delivery=message.metadata?.delivery_email,deliveryLabel=team&&delivery==='failed'?' · Delivery failed':team&&delivery==='not_configured'?' · Email unavailable':team&&delivery==='not_sent'?' · Preview':'';return `<div class="chat-line ${team?'team':'customer'}">${team?'':customerAvatar()}<div class="chat-message"><div class="chat-bubble">${esc(message.content)}</div><span class="chat-meta">${esc(team?'Nora':message.sender_name||name)} · Email${esc(deliveryLabel)} · ${esc(date(message.created_at))}</span></div></div>`}).join('')}</div>${scriptDrawer(thread)}<form class="conversation-composer" data-conversation-form>${feedback?.status==='error'?`<span class="composer-error">${esc(feedback.text)}</span>`:''}<div class="composer-row"><textarea class="composer-input" name="content" maxlength="30000" rows="1" placeholder="Write as Nora…" aria-label="Email ${esc(name)}" ${canSend?'':'disabled'}>${esc(session.composer)}</textarea><button class="composer-send" type="submit" ${canSend?'':'disabled'}>Send</button></div><span class="sr-only composer-feedback" data-composer-feedback role="status" aria-live="polite">${feedback?esc(feedback.text):''}</span></form></section></div>`;
    }
    async function requestScriptDraft(thread,force=false){
      const session=scriptSession(thread),key=scriptCacheKey(session);if(session.loading||(!force&&session.drafts[key]))return;session.loading=true;session.error='';renderDetail();
      try{const response=await fetch('/api/ops-script',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({application_id:thread.application_id,path:session.path,stage:session.stage,format:session.format})});const result=await response.json();if(response.status===401){location.href='/ops-login?next=/ops';return}if(!response.ok||!result.draft)throw new Error(result.error||'Draft unavailable.');session.drafts[key]=String(result.draft).trim();session.progress[key]=result.script_progress||null}catch(error){session.error=error.message}finally{session.loading=false;renderDetail()}
    }
    async function persistScriptProgress(thread,completed=true){
      const session=scriptSession(thread),key=`${session.path}:${session.stage}`;session.completed[key]=completed;renderDetail();
      try{const response=await fetch('/api/ops-message',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'script-progress',application_id:thread.application_id,path:session.path,stage:session.stage,completed:session.completed})});if(response.status===401){location.href='/ops-login?next=/ops';return}if(!response.ok)throw new Error('Progress could not be stored.');const stages=SCRIPT_PATHS[session.path].stages,index=stages.findIndex(([stage])=>stage===session.stage);session.stage=stages[Math.min(index+1,stages.length-1)][0];renderDetail();requestScriptDraft(thread)}catch(error){delete session.completed[key];session.error=error.message;renderDetail()}
    }
    async function sendConversation(thread,form){
      const session=scriptSession(thread),input=form.elements.content,button=form.querySelector('.composer-send'),feedback=form.querySelector('[data-composer-feedback]'),content=String(input.value||'').trim();if(!content)return;button.disabled=true;input.disabled=true;feedback.textContent='Sending email…';
      try{const response=await fetch('/api/ops-message',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'send',application_id:thread.application_id,content,script_progress:session.activeProgress||undefined})});const result=await response.json();if(response.status===401){location.href='/ops-login?next=/ops';return}if(!response.ok||!result.message)throw new Error(result.error||'Email could not be delivered.');const now=new Date().toISOString();state.data.interactions.forEach(item=>{if(item.application_id===thread.application_id&&item.sender_type==='customer'&&!item.read_at)item.read_at=now});state.data.interactions.push({...result.message,application_id:result.message.application_id||thread.application_id,email:result.message.email||thread.email,sender_type:'team',sender_name:'Nora',message_type:'text',created_at:result.message.created_at||now});session.composer='';session.activeProgress=null;const emailStatus=result.delivery?.email,auditWarning=result.audit==='unavailable'?' · audit warning':'',stateLabel=(emailStatus==='preview_not_sent'?'Previewed locally · no email sent':emailStatus==='sent'?'Email sent':emailStatus==='failed'?'Email failed':emailStatus==='not_configured'?'Email unavailable':'Email stored')+auditWarning;state.deliveryFeedback={threadId:thread.id,text:stateLabel,status:emailStatus==='failed'||emailStatus==='not_configured'||result.audit==='unavailable'?'error':'success'};setBadges();renderMetrics();renderList();renderDetail()}catch(error){state.deliveryFeedback={threadId:thread.id,text:error.message,status:'error'};feedback.textContent=error.message;button.disabled=false;input.disabled=false;renderDetail()}
    }
    function bindConversation(box,thread){
      const session=scriptSession(thread),close=box.querySelector('[data-close]'),details=box.querySelector('.conversation-context'),scroller=box.querySelector('[data-conversation-messages]'),form=box.querySelector('[data-conversation-form]'),input=form?.elements.content;
      const rememberScroll=()=>{if(scroller)session.chatScrollTop=scroller.scrollTop};
      if(close)close.onclick=event=>{event.preventDefault();event.stopPropagation();state.selected=null;state.deliveryFeedback=null;renderList();renderDetail()};
      if(details)details.onclick=event=>{if(event.target.closest('[data-open-entity]'))event.preventDefault()};
      if(form)form.onsubmit=event=>{event.preventDefault();sendConversation(thread,form)};
      if(input){const size=()=>{input.style.height='auto';input.style.height=`${Math.min(112,input.scrollHeight)}px`};input.oninput=()=>{session.composer=input.value;size()};input.onkeydown=event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();form.requestSubmit()}if(event.key==='Escape'&&session.open){session.open=false;renderDetail()}};size()}
      const toggle=box.querySelector('[data-script-toggle]');if(toggle)toggle.onclick=()=>{rememberScroll();session.open=!session.open;renderDetail();if(session.open)requestScriptDraft(thread)};
      const path=box.querySelector('[data-script-path]');if(path)path.onchange=()=>{rememberScroll();session.path=path.value;session.stage=SCRIPT_PATHS[session.path].stages[0][0];session.error='';renderDetail();requestScriptDraft(thread)};
      box.querySelectorAll('[data-script-format]').forEach(button=>button.onclick=()=>{rememberScroll();session.format=button.dataset.scriptFormat;session.error='';renderDetail();requestScriptDraft(thread)});
      box.querySelectorAll('[data-script-stage]').forEach(button=>button.onclick=()=>{rememberScroll();session.stage=button.dataset.scriptStage;session.error='';renderDetail();requestScriptDraft(thread)});
      const use=box.querySelector('[data-script-use]');if(use)use.onclick=()=>{const key=scriptCacheKey(session);session.composer=session.drafts[key]||'';session.activeProgress=session.progress[key]||null;renderDetail();requestAnimationFrame(()=>$('detail').querySelector('.composer-input')?.focus())};
      const complete=box.querySelector('[data-script-complete]');if(complete)complete.onclick=()=>persistScriptProgress(thread,true);
      if(scroller)scroller.onscroll=()=>{session.chatScrollTop=scroller.scrollTop};
      requestAnimationFrame(()=>{if(scroller)scroller.scrollTop=Number.isFinite(session.chatScrollTop)?session.chatScrollTop:scroller.scrollHeight})
    }
    function decisionDetail(item){return `<div class="detail-top"><div><span class="tag approval">Robin approval · ${esc(item.priority)}</span><h2>${esc(item.person_name)}</h2><p>${esc(item.offer?.name||'Verified exception')}</p></div><button class="close" data-close aria-label="Close detail">×</button></div><div class="detail-body"><div class="fact-grid">${fact('1 · What happened',item.happened,true)}<div class="fact wide"><label>2 · Verified facts</label><ul>${item.verified_facts.map(value=>`<li>${esc(value)}</li>`).join('')}</ul></div>${fact('3 · Nora recommends',item.recommendation,true)}${fact('4 · After confirmation',item.after_confirmation,true)}</div><div class="decision-actions"><button class="decision-action" data-decision-status="approved">Approve & queue</button><button class="decision-action hold" data-decision-status="held">Hold</button></div><p class="decision-status" data-decision-feedback>No external action runs from this click.</p><button class="link-button" data-open-entity="${esc(item.entity_id)}">Open source context</button></div>`}
    async function persistDecision(item,status,buttons,feedback){buttons.forEach(button=>button.disabled=true);feedback.textContent='Recording decision…';try{const response=await fetch('/api/ops-decision',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({...item,status})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Decision could not be recorded.');feedback.textContent=status==='approved'?'Approved and queued. No external action was executed.':'Held. No external action was executed.';setTimeout(()=>location.reload(),450)}catch(error){feedback.textContent=error.message;buttons.forEach(button=>button.disabled=false)}}
    function renderDetail(){const box=$('detail'),grid=$('contentGrid');if(!state.selected){box.hidden=true;grid.classList.remove('has-detail','has-inbox-detail');return}let html='',selectedItem=null,conversation=null;if(state.selected.kind==='task'){const item=state.data.command_queue.find(value=>value.id===state.selected.id);if(item)html=taskDetail(item)}if(state.selected.kind==='entity'){const item=allEntities().find(value=>value.id===state.selected.id);if(item)html=entityDetail(item)}if(state.selected.kind==='opportunity'){const item=state.data.opportunities.find(value=>value.id===state.selected.id);if(item)html=opportunityDetail(item)}if(state.selected.kind==='interaction'){const item=state.data.interactions.find(value=>value.id===state.selected.id);if(item)html=interactionDetail(item)}if(state.selected.kind==='conversation'){conversation=inboxItems().find(value=>value.id===state.selected.id);if(conversation)html=conversationDetail(conversation)}if(state.selected.kind==='decision'){selectedItem=state.data.decisions.find(value=>value.id===state.selected.id);if(selectedItem)html=decisionDetail(selectedItem)}if(!html){state.selected=null;return renderDetail()}box.innerHTML=html;box.hidden=false;grid.classList.toggle('has-detail',!conversation);grid.classList.toggle('has-inbox-detail',Boolean(conversation));if(conversation)bindConversation(box,conversation);else{const close=box.querySelector('[data-close]');if(close)close.onclick=()=>{state.selected=null;renderList();renderDetail()}}box.querySelectorAll('[data-open-entity]').forEach(button=>button.onclick=()=>{state.view='customers';state.filter='all';state.selected={id:button.dataset.openEntity,kind:'entity'};state.deliveryFeedback=null;render()});if(selectedItem){const buttons=[...box.querySelectorAll('[data-decision-status]')],feedback=box.querySelector('[data-decision-feedback]');buttons.forEach(button=>button.onclick=()=>persistDecision(selectedItem,button.dataset.decisionStatus,buttons,feedback))}}
    function renderFocus(){const queue=state.data.command_queue,approvals=state.data.decisions.length;let primary='Nothing waiting',secondary='Source-backed queue';if(queue.length){primary=queue[0].action;secondary=`Next · ${queue[0].person_name}`}if(state.view==='decisions'){primary=approvals?`${approvals} approval${approvals===1?'':'s'} waiting`:'No approval needed';secondary='Nora continues within policy'}$('focusSummary').innerHTML=`<b>${esc(primary)}</b><span>${esc(secondary)}</span>`}
    function render(){const def=defs[state.view];$('eyebrow').textContent=def.eyebrow;$('title').textContent=def.title;$('subtitle').textContent=def.subtitle;document.querySelectorAll('[data-side-nav] button').forEach(button=>button.classList.toggle('active',button.dataset.view===state.view));renderMetrics();renderLifecycle();renderAutonomy();renderFilters();renderFocus();renderList();renderDetail()}
    document.querySelectorAll('[data-side-nav] button').forEach(button=>button.onclick=()=>{state.view=button.dataset.view;state.filter='all';state.query='';state.selected=null;$('searchInput').value='';render()});
    $('searchInput').addEventListener('input',event=>{state.query=event.target.value;state.selected=null;renderList();renderDetail()});
    fetch('/api/crm-data',{credentials:'same-origin'}).then(async response=>{if(response.status===401){location.href='/ops-login?next=/ops';return}const data=await response.json();if(!response.ok)throw new Error(data.error||'Ops unavailable');state.data={...data,people:Array.isArray(data.people)?data.people:[],leads:Array.isArray(data.leads)?data.leads:[],opportunities:Array.isArray(data.opportunities)?data.opportunities:[],launch_workspaces:Array.isArray(data.launch_workspaces)?data.launch_workspaces:[],interactions:Array.isArray(data.interactions)?data.interactions:[],activity_events:Array.isArray(data.activity_events)?data.activity_events:[],command_queue:Array.isArray(data.command_queue)?data.command_queue:[],decisions:Array.isArray(data.decisions)?data.decisions:[],decision_history:Array.isArray(data.decision_history)?data.decision_history:[]};state.phasePreview=Number(data.autonomy_policy?.active_phase)||1;const localScenarios=Boolean(data.local_dev_scenario_data);$('syncStatus').textContent=localScenarios?`Local scenarios · ${date(data.generated_at)}`:`Verified ledger · ${date(data.generated_at)}`;$('sourceMode').textContent=localScenarios?'LOCAL SCENARIOS · NOT PRODUCTION':`AUDIT LEDGER · ${data.audit_coverage?.event_count||0} EVENTS`;setBadges();render()}).catch(()=>{$('syncStatus').textContent='Source unavailable';$('list').innerHTML='<div class="error">Operations data is temporarily unavailable. Refresh in a moment.</div>';$('metrics').innerHTML=''});
  </script>
</body>
