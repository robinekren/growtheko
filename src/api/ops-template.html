<body>
  <div class="ops-app">
    <aside class="sidebar">
      <div class="side-brand"><i>G</i><div><strong>GROWTHEKO</strong><small>NORA OPS</small></div></div>
      <nav class="side-nav" data-side-nav aria-label="Nora Ops modules">
        <button class="active" data-view="queue"><i>01</i><span>Queue</span><em id="queueBadge">0</em></button>
        <button data-view="customers"><i>02</i><span>Customers</span></button>
        <button data-view="pipeline"><i>03</i><span>Pipeline</span></button>
        <button data-view="inbox"><i>04</i><span>Inbox</span><em id="inboxBadge">0</em></button>
        <button data-view="decisions"><i>05</i><span>Decisions</span><em id="decisionBadge">0</em></button>
      </nav>
      <div class="side-foot"><i></i><div><strong>Policy-controlled</strong><small id="sourceMode">REAL DATA ONLY</small></div></div>
    </aside>
    <main class="workspace">
      <header class="topbar">
        <div class="sync"><i></i><span id="syncStatus">Loading source…</span></div>
        <label class="search" aria-label="Search current view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="searchInput" type="search" placeholder="Search this view" autocomplete="off"></label>
      </header>
      <div class="canvas">
        <section class="page-head"><div><span class="eyebrow" id="eyebrow">Nora control surface</span><h1 class="headline" id="title">Command Queue</h1><p class="sub" id="subtitle">One verified next action per record. Nora works from top to bottom; exceptions stop for approval.</p></div><div class="focus" id="focusSummary"><b>Nothing waiting</b><span>Source-backed queue</span></div></section>
        <section class="metrics" id="metrics"></section>
        <section class="lifecycle" id="offerLifecycle" hidden></section>
        <section class="autonomy" id="autonomyPanel" hidden></section>
        <div class="toolbar"><div class="filters" id="filters"></div><span class="result-count" id="resultCount"></span></div>
        <div class="content-grid" id="contentGrid"><section class="panel list" id="list"><div class="loading">Loading verified operations data…</div></section><aside class="detail-panel" id="detail" hidden></aside></div>
        <details class="decision-history" id="decisionHistory" hidden></details>
      </div>
    </main>
  </div>
  <script>
    const state={data:null,view:'queue',filter:'all',query:'',selected:null,phasePreview:null,historyQuery:'',historyWindow:'all'};
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const date=value=>value?new Intl.DateTimeFormat('en-GB',{dateStyle:'medium',timeStyle:'short'}).format(new Date(value)):'Not stored';
    const money=(value,currency='USD')=>new Intl.NumberFormat('en-US',{style:'currency',currency,maximumFractionDigits:0}).format(Number(value)||0);
    const defs={
      queue:{eyebrow:'Nora control surface',title:'Command Queue',subtitle:'One verified next action per record. Nora works from top to bottom; exceptions stop for approval.'},
      customers:{eyebrow:'Single source of truth',title:'Customer 360',subtitle:'One record per lead or customer. Open it for the next action, onboarding, offer and complete customer timeline.'},
      pipeline:{eyebrow:'Opportunity truth',title:'Pipeline',subtitle:'Every opportunity, offer, revenue stage and next action in one operating view.'},
      inbox:{eyebrow:'Canonical communication',title:'Inbox',subtitle:'Messages and meeting transcripts in one chronological queue. Customer context opens beside it.'},
      decisions:{eyebrow:'Robin approval only',title:'Decisions',subtitle:'Only unresolved exceptions that Nora is not allowed to execute autonomously.'}
    };
    const filterDefs={
      queue:[['all','All'],['nora','Automatic'],['approval','Approval'],['p0','P0']],
      customers:[['all','All'],['customer','Customers'],['lead','Leads']],
      pipeline:[['all','All stages'],['diagnose','Diagnose'],['commit','Commit'],['deliver','Deliver'],['prove','Prove'],['attention','Attention']],
      inbox:[['all','All'],['unread','Needs reply'],['meeting','Meetings']],

    function decisionDetail(item){return `<div class="detail-top"><div><span class="tag approval">Robin approval · ${esc(item.priority)}</span><h2>${esc(item.person_name)}</h2><p>${esc(item.offer?.name||'Verified exception')}</p></div><button class="close" data-close aria-label="Close detail">×</button></div><div class="detail-body"><div class="fact-grid">${fact('1 · What happened',item.happened,true)}<div class="fact wide"><label>2 · Verified facts</label><ul>${item.verified_facts.map(value=>`<li>${esc(value)}</li>`).join('')}</ul></div>${fact('3 · Nora recommends',item.recommendation,true)}${fact('4 · After confirmation',item.after_confirmation,true)}</div><div class="decision-actions"><button class="decision-action" data-decision-status="approved">Approve & queue</button><button class="decision-action hold" data-decision-status="held">Hold</button></div><p class="decision-status" data-decision-feedback>No external action runs from this click.</p><button class="link-button" data-open-entity="${esc(item.entity_id)}">Open source context</button></div>`}
    async function persistDecision(item,status,buttons,feedback){buttons.forEach(button=>button.disabled=true);feedback.textContent='Recording decision…';try{const response=await fetch('/api/ops-decision',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({...item,status})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Decision could not be recorded.');feedback.textContent=status==='approved'?'Approved and queued. No external action was executed.':'Held. No external action was executed.';setTimeout(()=>location.reload(),450)}catch(error){feedback.textContent=error.message;buttons.forEach(button=>button.disabled=false)}}
    function renderDetail(){const box=$('detail');if(!state.selected){box.hidden=true;$('contentGrid').classList.remove('has-detail');return}let html='',selectedItem=null;if(state.selected.kind==='task'){const item=state.data.command_queue.find(value=>value.id===state.selected.id);if(item)html=taskDetail(item)}if(state.selected.kind==='entity'){const item=allEntities().find(value=>value.id===state.selected.id);if(item)html=entityDetail(item)}if(state.selected.kind==='opportunity'){const item=state.data.opportunities.find(value=>value.id===state.selected.id);if(item)html=opportunityDetail(item)}if(state.selected.kind==='interaction'){const item=state.data.interactions.find(value=>value.id===state.selected.id);if(item)html=interactionDetail(item)}if(state.selected.kind==='decision'){selectedItem=state.data.decisions.find(value=>value.id===state.selected.id);if(selectedItem)html=decisionDetail(selectedItem)}if(!html){state.selected=null;return renderDetail()}box.innerHTML=html;box.hidden=false;$('contentGrid').classList.add('has-detail');box.querySelector('[data-close]').onclick=()=>{state.selected=null;renderList();renderDetail()};box.querySelectorAll('[data-open-entity]').forEach(button=>button.onclick=()=>{state.view='customers';state.filter='all';state.selected={id:button.dataset.openEntity,kind:'entity'};render()});if(selectedItem){const buttons=[...box.querySelectorAll('[data-decision-status]')],feedback=box.querySelector('[data-decision-feedback]');buttons.forEach(button=>button.onclick=()=>persistDecision(selectedItem,button.dataset.decisionStatus,buttons,feedback))}}
    function renderFocus(){const queue=state.data.command_queue,approvals=state.data.decisions.length;let primary='Nothing waiting',secondary='Source-backed queue';if(queue.length){primary=queue[0].action;secondary=`Next · ${queue[0].person_name}`}if(state.view==='decisions'){primary=approvals?`${approvals} approval${approvals===1?'':'s'} waiting`:'No approval needed';secondary='Nora continues within policy'}$('focusSummary').innerHTML=`<b>${esc(primary)}</b><span>${esc(secondary)}</span>`}
    function render(){const def=defs[state.view];$('eyebrow').textContent=def.eyebrow;$('title').textContent=def.title;$('subtitle').textContent=def.subtitle;document.querySelectorAll('[data-side-nav] button').forEach(button=>button.classList.toggle('active',button.dataset.view===state.view));renderMetrics();renderLifecycle();renderAutonomy();renderFilters();renderFocus();renderList();renderDetail()}
    document.querySelectorAll('[data-side-nav] button').forEach(button=>button.onclick=()=>{state.view=button.dataset.view;state.filter='all';state.query='';state.selected=null;$('searchInput').value='';render()});
    $('searchInput').addEventListener('input',event=>{state.query=event.target.value;state.selected=null;renderList();renderDetail()});
    fetch('/api/crm-data',{credentials:'same-origin'}).then(async response=>{if(response.status===401){location.href='/ops-login?next=/ops';return}const data=await response.json();if(!response.ok)throw new Error(data.error||'Ops unavailable');state.data={...data,people:Array.isArray(data.people)?data.people:[],leads:Array.isArray(data.leads)?data.leads:[],opportunities:Array.isArray(data.opportunities)?data.opportunities:[],launch_workspaces:Array.isArray(data.launch_workspaces)?data.launch_workspaces:[],interactions:Array.isArray(data.interactions)?data.interactions:[],activity_events:Array.isArray(data.activity_events)?data.activity_events:[],command_queue:Array.isArray(data.command_queue)?data.command_queue:[],decisions:Array.isArray(data.decisions)?data.decisions:[],decision_history:Array.isArray(data.decision_history)?data.decision_history:[]};state.phasePreview=Number(data.autonomy_policy?.active_phase)||1;const localScenarios=Boolean(data.local_dev_scenario_data);$('syncStatus').textContent=localScenarios?`Local scenarios · ${date(data.generated_at)}`:`Verified ledger · ${date(data.generated_at)}`;$('sourceMode').textContent=localScenarios?'LOCAL SCENARIOS · NOT PRODUCTION':`AUDIT LEDGER · ${data.audit_coverage?.event_count||0} EVENTS`;setBadges();render()}).catch(()=>{$('syncStatus').textContent='Source unavailable';$('list').innerHTML='<div class="error">Operations data is temporarily unavailable. Refresh in a moment.</div>';$('metrics').innerHTML=''});
  </script>
</body>
</html>
