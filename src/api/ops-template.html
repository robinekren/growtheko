<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>GrowthEko Ops</title>
  <style>
    :root {
      --bg: #f5f8ff;
      --panel: rgba(255, 255, 255, 0.78);
      --panel-solid: #ffffff;
      --ink: #0d1220;
      --muted: #697386;
      --quiet: #98a2b3;
      --line: rgba(15, 23, 42, 0.08);
      --blue: #276ef1;
      --blue-soft: #e7f0ff;
      --green: #0f8b62;
      --gold: #d8a84e;
      --red: #d64b4b;
      --shadow: 0 20px 60px rgba(31, 45, 76, 0.12);
      --radius: 18px;
      --sidebar: 232px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 18% 10%, rgba(86, 144, 255, 0.20), transparent 26%),
        radial-gradient(circle at 86% 4%, rgba(198, 218, 255, 0.55), transparent 24%),
        linear-gradient(135deg, #f8fbff 0%, #eef5ff 44%, #f7f9ff 100%);
      color: var(--ink);
      overflow: hidden;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
    }

    .sidebar {
      min-height: 100vh;
      padding: 22px 16px;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.64);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px;
    }

    .mark {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0d1220, #26345d);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      letter-spacing: -0.05em;
    }

    .brand-title {
      display: flex;
      flex-direction: column;
      line-height: 1.08;
    }

    .brand-title strong {
      font-size: 14px;
      letter-spacing: 0.04em;
    }

    .brand-title span {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .nav {
      display: grid;
      gap: 7px;
    }

    .nav-btn {
      width: 100%;
      min-height: 42px;
      padding: 0 12px;
      border-radius: 12px;
      color: var(--muted);
      background: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      font-weight: 700;
      transition: background 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.72);
      color: var(--ink);
    }

    .nav-btn.active {
      background: #0d1220;
      color: #fff;
      box-shadow: 0 10px 26px rgba(13, 18, 32, 0.16);
    }

    .nav-icon {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      stroke-width: 2.1;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .sidebar-card {
      margin-top: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.62);
    }

    .sidebar-card small {
      color: var(--muted);
      display: block;
      line-height: 1.45;
    }

    .main {
      height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
    }

    .topbar {
      padding: 18px 24px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.50);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .headline {
      min-width: 0;
    }

    .eyebrow {
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
      letter-spacing: -0.035em;
      line-height: 1.02;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .search {
      width: 260px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      padding: 0 16px;
      color: var(--ink);
      outline: none;
      box-shadow: 0 8px 26px rgba(31, 45, 76, 0.05);
    }

    .primary-btn {
      min-height: 42px;
      padding: 0 16px;
      border-radius: 999px;
      background: #0d1220;
      color: #fff;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .content {
      min-height: 0;
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 16px;
      padding: 16px;
    }

    .workspace {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(130px, 1fr));
      gap: 12px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 15px;
      box-shadow: 0 10px 34px rgba(31, 45, 76, 0.06);
    }

    .stat strong {
      display: block;
      font-size: 22px;
      letter-spacing: -0.03em;
      margin-bottom: 2px;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .view {
      min-height: 0;
      min-width: 0;
      display: none;
    }

    .view.active {
      display: block;
    }

    .board-wrap {
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 10px;
    }

    .board {
      height: 100%;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 286px;
      gap: 12px;
      min-width: max-content;
    }

    .column {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.56);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }

    .column.over {
      outline: 2px solid rgba(39, 110, 241, 0.28);
      background: rgba(231, 240, 255, 0.78);
    }

    .column-head {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .column-title {
      font-size: 13px;
      font-weight: 850;
      letter-spacing: -0.01em;
    }

    .count {
      min-width: 24px;
      height: 24px;
      padding: 0 7px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgba(13, 18, 32, 0.08);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .cards {
      min-height: 0;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .lead-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.9);
      padding: 13px;
      box-shadow: 0 10px 28px rgba(31, 45, 76, 0.07);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
      user-select: none;
    }

    .lead-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(31, 45, 76, 0.12);
      border-color: rgba(39, 110, 241, 0.20);
    }

    .lead-card.dragging {
      opacity: 0.52;
      transform: scale(0.98);
    }

    .lead-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .lead-name {
      font-weight: 850;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .lead-company {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .value {
      color: var(--green);
      font-weight: 850;
      font-size: 13px;
      white-space: nowrap;
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 11px;
    }

    .chip {
      border-radius: 999px;
      padding: 4px 8px;
      background: rgba(13, 18, 32, 0.06);
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .chip.blue { background: var(--blue-soft); color: var(--blue); }
    .chip.green { background: #e5f7ef; color: var(--green); }
    .chip.gold { background: #fff3d8; color: #9a6a0d; }
    .chip.red { background: #ffe8e8; color: var(--red); }

    .next {
      border-top: 1px solid rgba(15, 23, 42, 0.06);
      padding-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .due {
      color: var(--ink);
      white-space: nowrap;
    }

    .panel {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .panel-head {
      padding: 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .panel-title {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.035em;
    }

    .panel-sub {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .close-drawer {
      display: none;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: rgba(13, 18, 32, 0.06);
      color: var(--ink);
      font-size: 20px;
    }

    .panel-body {
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 11px;
      background: rgba(255, 255, 255, 0.76);
      min-width: 0;
    }

    .field label {
      display: block;
      color: var(--quiet);
      font-size: 10px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 5px;
    }

    .field div {
      color: var(--ink);
      font-size: 13px;
      font-weight: 750;
      overflow-wrap: anywhere;
      line-height: 1.35;
    }

    .section-title {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .note {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 13px;
      background: rgba(255, 255, 255, 0.72);
      color: #30394c;
      font-size: 13px;
      line-height: 1.48;
    }

    .timeline {
      display: grid;
      gap: 10px;
    }

    .event {
      display: grid;
      grid-template-columns: 8px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      margin-top: 6px;
      background: var(--blue);
    }

    .event strong {
      display: block;
      font-size: 13px;
    }

    .event span {
      color: var(--muted);
      font-size: 12px;
      display: block;
      margin-top: 2px;
    }

    .panel-actions {
      border-top: 1px solid var(--line);
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      background: rgba(255, 255, 255, 0.65);
    }

    .action {
      min-height: 40px;
      border-radius: 12px;
      background: rgba(13, 18, 32, 0.06);
      color: var(--ink);
      font-weight: 850;
    }

    .action.dark {
      background: #0d1220;
      color: #fff;
    }

    .list-view {
      height: 100%;
      overflow-y: auto;
      display: grid;
      align-content: start;
      gap: 10px;
    }

    .row {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.78);
      padding: 14px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
    }

    .row strong {
      display: block;
      letter-spacing: -0.01em;
    }

    .row span {
      color: var(--muted);
      font-size: 13px;
      display: block;
      margin-top: 3px;
    }

    .admin-grid {
      height: 100%;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-content: start;
      gap: 12px;
    }

    .admin-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.78);
      padding: 15px;
      min-height: 116px;
      box-shadow: 0 10px 30px rgba(31, 45, 76, 0.06);
    }

    .admin-card.wide {
      grid-column: span 2;
    }

    .admin-card.full {
      grid-column: 1 / -1;
    }

    .admin-card h3 {
      margin: 0 0 12px;
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .metric strong {
      display: block;
      font-size: 24px;
      letter-spacing: -0.035em;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .danger-list,
    .event-list,
    .chat-list {
      display: grid;
      gap: 9px;
    }

    .danger-item,
    .event-log,
    .message {
      border: 1px solid rgba(15, 23, 42, 0.07);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.76);
      padding: 10px;
      color: #30394c;
      font-size: 13px;
      line-height: 1.4;
    }

    .danger-item {
      border-color: rgba(214, 75, 75, 0.20);
      background: rgba(255, 232, 232, 0.62);
    }

    .message.team {
      background: rgba(231, 240, 255, 0.76);
      border-color: rgba(39, 110, 241, 0.16);
    }

    .message-meta {
      color: var(--muted);
      display: block;
      font-size: 11px;
      font-weight: 850;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .ai-box {
      border: 1px solid rgba(39, 110, 241, 0.18);
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(231, 240, 255, 0.86), rgba(255, 255, 255, 0.82));
      padding: 13px;
    }

    .ai-box p {
      margin: 0;
      color: #25324a;
      font-size: 13px;
      line-height: 1.48;
    }

    .script-box {
      border: 1px solid rgba(216, 168, 78, 0.28);
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255, 243, 216, 0.78), rgba(255, 255, 255, 0.84));
      padding: 13px;
      display: grid;
      gap: 10px;
    }

    .script-box p {
      margin: 0;
      color: #332a17;
      font-size: 13px;
      line-height: 1.48;
    }

    .script-line {
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.72);
      padding: 10px;
    }

    .script-line strong {
      display: block;
      color: #9a6a0d;
      font-size: 11px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .drawer-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .mobile-tabs {
      display: none;
    }

    @media (max-width: 1080px) {
      :root { --sidebar: 76px; }
      .brand-title, .nav-label, .sidebar-card { display: none; }
      .brand { justify-content: center; padding: 0; }
      .nav-btn { justify-content: center; padding: 0; }
      .content { grid-template-columns: minmax(0, 1fr) 330px; }
      .stats { grid-template-columns: repeat(2, minmax(130px, 1fr)); }
    }

    @media (max-width: 780px) {
      html, body { overflow: auto; }
      .app {
        min-height: 100svh;
        display: block;
        padding-bottom: 76px;
      }
      .sidebar { display: none; }
      .main {
        height: auto;
        min-height: 100svh;
        display: block;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 15;
        padding: 16px 15px 12px;
        align-items: flex-start;
      }
      .top-actions { display: none; }
      h1 { font-size: 27px; }
      .content {
        display: block;
        padding: 12px;
      }
      .workspace {
        display: block;
      }
      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-bottom: 12px;
      }
      .stat {
        border-radius: 16px;
        padding: 12px;
      }
      .stat strong { font-size: 20px; }
      .view.active {
        min-height: calc(100svh - 250px);
      }
      .board-wrap {
        height: calc(100svh - 254px);
        overflow-x: auto;
        overflow-y: hidden;
      }
      .board {
        grid-auto-columns: 82vw;
      }
      .panel {
        position: fixed;
        inset: auto 10px 84px 10px;
        max-height: 78svh;
        z-index: 30;
        transform: translateY(calc(100% + 92px));
        transition: transform 220ms ease;
      }
      .panel.open {
        transform: translateY(0);
      }
      .close-drawer { display: grid; place-items: center; }
      .field-grid { grid-template-columns: 1fr; }
      .panel-actions { grid-template-columns: 1fr; }
      .mobile-tabs {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: 10px;
        z-index: 35;
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 6px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.84);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow: 0 18px 50px rgba(31, 45, 76, 0.18);
      }
      .mobile-tabs .nav-btn {
        min-height: 48px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        gap: 0;
      }
      .mobile-tabs .nav-label { display: none; }
      .row {
        grid-template-columns: 1fr;
      }
      .admin-grid {
        grid-template-columns: 1fr;
      }
      .admin-card,
      .admin-card.wide,
      .admin-card.full {
        grid-column: auto;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="GrowthEko Ops Navigation">
      <div class="brand">
        <div class="mark">G</div>
        <div class="brand-title">
          <strong>GrowthEko</strong>
          <span>Ops Command</span>
        </div>
      </div>
      <nav class="nav" data-nav></nav>
      <div class="sidebar-card">
        <small>One team view. Pipeline, customers, tasks, messages, and revenue stay in one internal place.</small>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="headline">
          <div class="eyebrow">Internal CRM</div>
          <h1 id="viewTitle">Pipeline</h1>
        </div>
        <div class="top-actions">
          <input class="search" id="searchInput" type="search" placeholder="Search client, email, source">
          <button class="primary-btn" type="button" id="newTaskBtn">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            New Action
          </button>
        </div>
      </header>

      <section class="content">
        <div class="workspace">
          <div class="stats" id="stats"></div>
          <section class="view active" id="pipelineView">
            <div class="board-wrap">
              <div class="board" id="board"></div>
            </div>
          </section>
          <section class="view" id="inboxView"></section>
          <section class="view" id="customersView"></section>
          <section class="view" id="tasksView"></section>
          <section class="view" id="revenueView"></section>
          <section class="view" id="adminView"></section>
        </div>

        <aside class="panel" id="detailPanel" aria-label="Customer detail">
          <div class="panel-head">
            <div>
              <h2 class="panel-title" id="detailName">Select a card</h2>
              <div class="panel-sub" id="detailSub">Click any customer to see the full operating context.</div>
            </div>
            <button class="close-drawer" id="closeDrawer" type="button" aria-label="Close">x</button>
          </div>
          <div class="panel-body" id="detailBody"></div>
          <div class="panel-actions">
            <button class="action dark" type="button" data-action="follow-up">Send Follow-Up</button>

      if (['Paid', 'Signed', 'Active', 'Ready'].includes(value)) tone = 'green';
      if (['Pending', 'Sent'].includes(value)) tone = 'gold';
      if (['Locked', 'Open'].includes(value)) tone = value === 'Locked' ? 'red' : '';

    function dangerStates() {
      const states = [];
      people.forEach(p => {
        if (p.payment === 'Paid' && p.agreement !== 'Signed') states.push({ id: p.id, title: p.name + ': paid but not signed', meta: 'Agreement risk' });
        if (p.agreement === 'Signed' && p.payment !== 'Paid') states.push({ id: p.id, title: p.name + ': signed but not paid', meta: 'Cash risk' });
        if (p.payment === 'Paid' && p.agreement === 'Signed' && !['Ready', 'Active'].includes(p.portal)) states.push({ id: p.id, title: p.name + ': paid + signed but portal locked', meta: 'Delivery risk' });
        if (p.stage === 'Call Booked' && !p.timeline.some(t => t.toLowerCase().includes('prep'))) states.push({ id: p.id, title: p.name + ': call booked without prep note', meta: 'Sales risk' });
        if (p.stage === 'Offer Sent' && !p.due) states.push({ id: p.id, title: p.name + ': offer sent without follow-up', meta: 'Follow-up risk' });
        if (p.owner === 'CSM' && !p.next) states.push({ id: p.id, title: p.name + ': active customer without next action', meta: 'CSM risk' });
      });
      return states;

      const calls = people.filter(p => ['Call Booked', 'Call Completed', 'Offer Sent', 'Payment Pending', 'Paid + Signed'].includes(p.stage)).length;
      const offers = people.filter(p => ['Offer Sent', 'Follow-Up', 'Payment Pending', 'Agreement Pending', 'Paid + Signed'].includes(p.stage)).length;

      return { collected, pending, forecast, calls, offers, paid, highSignals, danger: dangerStates().length };

          card.classList.add('dragging');

        card.addEventListener('dragend', () => card.classList.remove('dragging'));

      document.querySelectorAll('.column').forEach(column => {
        column.addEventListener('dragover', event => {
          event.preventDefault();
          column.classList.add('over');
        });
        column.addEventListener('dragleave', () => column.classList.remove('over'));

          selectedId = id;
          persistPeople();
          renderAll();
        });
      });

      if (p.upsellSignal === 'High') return 'This sounds like the next bottleneck is not more information, but the exact growth path. I can get you on a private growth call so we map the next move properly.';

      const m = adminMetrics();
      const danger = dangerStates();
      const productMix = [
        ['Private Growth Setup', people.filter(p => p.product === 'Private Growth Setup').length],
        ['Premium Implementation', people.filter(p => p.product === 'Premium Implementation').length],
        ['Operator Membership', people.filter(p => p.product === 'GrowthEko Operator Membership').length]
      ];
      document.getElementById('adminView').innerHTML =
        '<div class="admin-grid">' +
          '<div class="admin-card"><h3>Cash</h3><div class="metric-grid">' +
            metric(money(m.collected), 'Collected') + metric(money(m.pending), 'Pending') + metric(money(m.forecast), 'Forecast') + metric(m.paid, 'Paid records') +
          '</div></div>' +
          '<div class="admin-card"><h3>Pipeline</h3><div class="metric-grid">' +
            metric(people.length, 'Records') + metric(m.calls, 'Call path') + metric(m.offers, 'Offer path') + metric(m.highSignals, 'High signals') +
          '</div></div>' +
          '<div class="admin-card"><h3>Team</h3><div class="metric-grid">' +
            metric(people.filter(p => p.owner === 'Director of Growth').length, 'Director') + metric(people.filter(p => p.owner === 'CSM').length, 'CSM') + metric(people.filter(p => ['Today', 'Now'].includes(p.due)).length, 'Due today') + metric(m.danger, 'Danger') +
          '</div></div>' +
          '<div class="admin-card wide"><h3>Danger States</h3><div class="danger-list">' + (danger.length ? danger.map(d => '<button class="danger-item" type="button" data-id="' + d.id + '"><strong>' + d.title + '</strong><br><span>' + d.meta + '</span></button>').join('') : '<div class="event-log">No danger states in demo data.</div>') + '</div></div>' +
          '<div class="admin-card"><h3>Product Mix</h3><div class="danger-list">' + productMix.map(p => '<div class="event-log"><strong>' + p[0] + '</strong><br><span>' + p[1] + ' records</span></div>').join('') + '</div></div>' +
          '<div class="admin-card full"><h3>Admin Daily Brief</h3><div class="event-log"><strong>Best next action:</strong> build Inbox + real event persistence next. Current demo shows where revenue, danger states, CSM signals, and delivery blockers must appear before Supabase/Auth are connected.</div></div>' +
        '</div>';
      document.querySelectorAll('#adminView [data-id]').forEach(row => row.addEventListener('click', () => selectPerson(row.dataset.id)));
    }

    function metric(value, label) {
      return '<div class="metric"><strong>' + value + '</strong><span>' + label + '</span></div>';
    }

    function setView(view) {
      currentView = view;
      document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
      document.getElementById(view + 'View').classList.add('active');
      document.getElementById('viewTitle').textContent = navItems.find(item => item[0] === view)[1];
      renderNav();
    }

    function renderAll() {
      renderStats();
      renderBoard();
      renderSecondaryViews();
      renderDetail();
    }

    searchInput.addEventListener('input', renderBoard);
    document.getElementById('closeDrawer').addEventListener('click', () => detailPanel.classList.remove('open'));
    document.getElementById('newTaskBtn').addEventListener('click', () => {
      const p = selectedPerson();
      p.timeline.unshift('New manual action prepared');
      p.events.unshift('Manual action created');
      p.next = 'Review next operator action';
      p.due = 'Today';
      persistPeople();
      renderAll();
    });

    document.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = selectedPerson();
        const action = btn.dataset.action;
        const labels = {
          'follow-up': 'Follow-up prepared',
          note: 'Internal note added',
          payment: 'Payment action prepared',
          portal: 'Portal activation action prepared'
        };
        p.events.unshift(labels[action] || 'Action prepared');
        p.timeline.unshift(labels[action] || 'Action prepared');
        if (action === 'portal' && p.payment === 'Paid' && p.agreement === 'Signed') {
          p.portal = 'Active';
          p.stage = 'Portal Active';
          p.activeStatus = 'Portal active';
        }
        persistPeople();
        renderAll();
      });
    });

    renderNav();
    renderAll();
  </script>
</body>
</html>
