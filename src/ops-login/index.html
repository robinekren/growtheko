<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>GrowthEko Ops Login</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, Arial, sans-serif;
      color: #0d1220;
      background:
        radial-gradient(circle at 18% 10%, rgba(86, 144, 255, 0.20), transparent 26%),
        radial-gradient(circle at 86% 4%, rgba(198, 218, 255, 0.55), transparent 24%),
        linear-gradient(135deg, #f8fbff 0%, #eef5ff 44%, #f7f9ff 100%);
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(100%, 390px);
      padding: 34px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 24px 70px rgba(31, 45, 76, 0.14);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .mark {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: #0d1220;
      color: #fff;
      font-weight: 800;
    }
    .brand strong {
      display: block;
      letter-spacing: 0.04em;
      font-size: 14px;
    }
    .brand span {
      display: block;
      margin-top: 3px;
      color: #697386;
      font-size: 12px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0 0 24px;
      color: #697386;
      line-height: 1.5;
      font-size: 14px;
    }
    label {
      display: block;
      margin-bottom: 9px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #697386;
      font-weight: 800;
    }
    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid rgba(15, 23, 42, 0.12);
      border-radius: 13px;
      background: #fff;
      font: inherit;
      outline: none;
    }
    input:focus {
      border-color: #276ef1;
      box-shadow: 0 0 0 4px rgba(39, 110, 241, 0.12);
    }
    button {
      width: 100%;
      height: 48px;
      margin-top: 14px;
      border: 0;
      border-radius: 13px;
      background: #0d1220;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }
    button[disabled] { opacity: 0.58; cursor: progress; }
    .error {
      display: none;
      margin-top: 12px;
      color: #d64b4b;
      font-size: 13px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="mark">G</div>
      <div>
        <strong>GrowthEko</strong>
        <span>Ops Command</span>
      </div>
    </div>
    <h1>Ops Login</h1>
    <p>Enter the internal access password to open the team pipeline.</p>
    <form id="loginForm">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button id="submitBtn" type="submit">Open Ops</button>
      <div class="error" id="error">Wrong password. Try again.</div>
    </form>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const button = document.getElementById('submitBtn');
    const error = document.getElementById('error');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.style.display = 'none';
      button.disabled = true;
      try {
        const response = await fetch('/api/ops-auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: form.password.value })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) throw new Error('denied');
        window.location.href = data.redirect || '/ops';
      } catch {
        error.style.display = 'block';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
